name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: provision
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: local-only-change-me
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U provision -d provision"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://provision:local-only-change-me@localhost:5432/provision?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server ./cmd/provisionctl
